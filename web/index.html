<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CircuitSim — a code-to-circuit simulator. Describe circuits in a small DSL and see them placed on a breadboard, then simulate and export them.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>CircuitSim — Code-to-Circuit Simulator</title>
    <style>
        /* ============================================
           THEME — CSS Custom Properties (defaults for dark)
           ============================================ */
        :root,
        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2128;
            --bg-elevated: #21262d;
            --bg-canvas: #0d1117;
            --bg-input: #0d1117;
            --bg-hover: #292e36;
            --bg-active: #2d333b;
            --border-primary: #30363d;
            --border-secondary: #21262d;
            --border-accent: #58a6ff;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-tertiary: #6e7681;
            --text-link: #58a6ff;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --accent-muted: #1f3a5f;
            --success: #3fb950;
            --success-muted: #1a4028;
            --warning: #d29922;
            --warning-muted: #3d2e00;
            --error: #f85149;
            --error-muted: #4a1c1c;
            --info: #58a6ff;
            --info-muted: #1f3a5f;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
            --editor-bg: #0d1117;
            --editor-gutter: #161b22;
            --editor-line-hl: #161b22;
            --syntax-comment: #6e7681;
            --syntax-component: #d2a8ff;
            --syntax-keyword: #ff7b72;
            --syntax-number: #79c0ff;
            --syntax-arrow: #58a6ff;
            --syntax-paren: #ffa657;
            --canvas-bg: #0e1116;
            /* Physical board colors (same in both themes) */
            --board-edge: #bbb;
            --board-rail: #f0ebe6;
            --board-channel: #c8c4bf;
            --board-hole: #222;
            --board-label: #888;
            --scrollbar-track: #161b22;
            --scrollbar-thumb: #30363d;
            --overlay-bg: rgba(0,0,0,0.5);
        }
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #f0f2f5;
            --bg-elevated: #ffffff;
            --bg-canvas: #f5f5f5;
            --bg-input: #ffffff;
            --bg-hover: #eaeef2;
            --bg-active: #dce1e6;
            --border-primary: #d0d7de;
            --border-secondary: #e1e4e8;
            --border-accent: #0969da;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-tertiary: #8b949e;
            --text-link: #0969da;
            --accent: #0969da;
            --accent-hover: #0550ae;
            --accent-muted: #ddf4ff;
            --success: #1a7f37;
            --success-muted: #dafbe1;
            --warning: #9a6700;
            --warning-muted: #fff8c5;
            --error: #cf222e;
            --error-muted: #ffebe9;
            --info: #0969da;
            --info-muted: #ddf4ff;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --editor-bg: #ffffff;
            --editor-gutter: #f6f8fa;
            --editor-line-hl: #f6f8fa;
            --syntax-comment: #6a737d;
            --syntax-component: #6f42c1;
            --syntax-keyword: #d73a49;
            --syntax-number: #005cc5;
            --syntax-arrow: #005cc5;
            --syntax-paren: #e36209;
            --canvas-bg: #f5f5f5;
            --scrollbar-track: #f0f2f5;
            --scrollbar-thumb: #c1c7cd;
            --overlay-bg: rgba(0,0,0,0.3);
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 13px;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        /* ============================================
           APP LAYOUT — 3-zone: toolbar | main | statusbar
           ============================================ */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* ============================================
           TOOLBAR
           ============================================ */
        .toolbar {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-primary);
            gap: 4px;
            flex-shrink: 0;
            z-index: 10;
        }
        .toolbar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 12px;
            margin-right: 8px;
            border-right: 1px solid var(--border-primary);
        }
        .toolbar-logo {
            width: 22px;
            height: 22px;
            color: var(--accent);
        }
        .toolbar-title {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .toolbar-title span {
            font-weight: 400;
            color: var(--text-tertiary);
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .toolbar-separator {
            width: 1px;
            height: 20px;
            background: var(--border-primary);
            margin: 0 6px;
        }
        .toolbar-spacer {
            flex: 1;
        }
        .tb-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .tb-btn:active {
            background: var(--bg-active);
        }
        .tb-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .tb-btn:disabled:hover {
            background: transparent;
            color: var(--text-secondary);
        }
        .tb-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .tb-btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .tb-btn-primary:hover {
            background: var(--accent-hover);
            color: #fff;
        }
        .tb-btn-icon {
            padding: 6px;
        }

        /* ============================================
           MAIN AREA — sidebar | canvas
           ============================================ */
        .main-area {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ============================================
           LEFT PANEL — component library + code editor
           ============================================ */
        .left-panel {
            width: 340px;
            min-width: 240px;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            flex-shrink: 0;
        }

        /* --- Component Library --- */
        .component-library {
            flex-shrink: 0;
            max-height: 40%;
            overflow-y: auto;
            border-bottom: 1px solid var(--border-primary);
        }
        .comp-lib-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-secondary);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .comp-lib-title { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .comp-lib-search {
            flex: 1;
            min-width: 0;
            padding: 3px 7px;
            background: var(--bg-input);
            border: 1px solid var(--border-secondary);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 11px;
            outline: none;
        }
        .comp-lib-search:focus { border-color: var(--accent); }
        .comp-lib-search::placeholder { color: var(--text-tertiary); }
        .comp-lib-empty {
            padding: 14px 12px;
            font-size: 11px;
            color: var(--text-tertiary);
            text-align: center;
        }
        .comp-lib-toggle {
            border: none;
            background: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 2px;
            border-radius: 3px;
        }
        .comp-lib-toggle:hover { background: var(--bg-hover); }
        .comp-lib-list { padding: 4px 0; }
        .comp-lib-cat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
        }
        .comp-lib-cat-header:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .comp-lib-cat-header.expanded { color: var(--text-primary); }
        .comp-lib-cat-icon {
            display: flex;
            align-items: center;
            color: var(--text-tertiary);
        }
        .comp-lib-cat-count {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-tertiary);
            background: var(--bg-elevated);
            padding: 1px 6px;
            border-radius: 10px;
        }
        .comp-lib-cat-arrow {
            display: flex;
            transition: transform 0.15s;
        }
        .comp-lib-cat-header.expanded .comp-lib-cat-arrow {
            transform: rotate(90deg);
        }
        .comp-lib-items {
            display: none;
            padding: 2px 0 4px 0;
        }
        .comp-lib-items.expanded { display: block; }
        .comp-lib-item {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 5px 12px 5px 34px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
        }
        .comp-lib-item:hover {
            background: var(--accent-muted);
            color: var(--text-primary);
        }
        .comp-lib-item-label {
            font-weight: 500;
            color: inherit;
        }
        .comp-lib-item-desc {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 1px;
        }

        /* --- Code Editor Panel --- */
        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .editor-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-secondary);
        }
        .editor-actions {
            display: flex;
            gap: 4px;
        }
        .editor-actions button {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-family: inherit;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }
        .editor-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .editor-actions .compile-btn {
            background: var(--accent);
            color: #fff;
            font-weight: 500;
        }
        .editor-actions .compile-btn:hover {
            background: var(--accent-hover);
        }

        /* --- CodeMirror-based DSL editor --- */
        .code-editor-wrapper {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: var(--editor-bg);
        }
        .code-editor-wrapper .cm-editor { height: 100%; }
        .code-editor-wrapper .cm-scroller {
            overflow: auto;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Monaco', monospace;
        }
        .cm-errorLine { background: var(--error-muted); }

        /* --- Error Panel --- */
        .error-panel {
            background: var(--error-muted);
            border-top: 1px solid var(--error);
            padding: 8px 12px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--error);
            max-height: 80px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .error-panel.hidden { display: none; }

        /* ============================================
           SPLIT HANDLE
           ============================================ */
        .split-handle {
            width: 5px;
            cursor: col-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--border-primary);
            flex-shrink: 0;
            transition: background 0.15s;
            z-index: 5;
        }
        .split-handle:hover, .split-handle.active {
            background: var(--accent);
        }
        .split-handle-bar {
            width: 2px;
            height: 24px;
            border-radius: 1px;
            background: var(--text-tertiary);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .split-handle:hover .split-handle-bar { opacity: 1; }

        /* ============================================
           CANVAS PANEL
           ============================================ */
        .canvas-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--canvas-bg);
            min-width: 0;
        }
        #circuit-canvas {
            display: block;
            touch-action: none;
        }

        /* ============================================
           ZOOM CONTROLS
           ============================================ */
        .zoom-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 3px;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .zoom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .zoom-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .zoom-label {
            padding: 0 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            min-width: 38px;
            text-align: center;
        }
        .zoom-label:hover { color: var(--accent); }

        /* ============================================
           STATUS BAR
           ============================================ */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 26px;
            padding: 0 12px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-primary);
            font-size: 11px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }
        .status-bar-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .status-bar-left { min-width: 180px; }
        .status-bar-center { flex: 1; justify-content: center; }
        .status-bar-right { min-width: 200px; justify-content: flex-end; }
        .status-bar-item { display: flex; align-items: center; gap: 4px; }
        .status-bar-hint { color: var(--text-tertiary); opacity: 0.7; }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot-ready { background: var(--success); }
        .status-dot-compiling { background: var(--warning); animation: pulse 1s infinite; }
        .status-dot-error { background: var(--error); }
        .status-dot-success { background: var(--success); }
        .status-indicator { font-weight: 500; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ============================================
           TOAST NOTIFICATIONS
           ============================================ */
        .toast-container {
            position: fixed;
            top: 56px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 14px;
            min-width: 280px;
            max-width: 420px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            font-size: 12px;
            color: var(--text-primary);
            pointer-events: all;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .toast-visible {
            transform: translateX(0);
            opacity: 1;
        }
        .toast-exit {
            transform: translateX(120%);
            opacity: 0;
        }
        .toast-icon { flex-shrink: 0; margin-top: 1px; }
        .toast-message { flex: 1; line-height: 1.4; }
        .toast-close {
            flex-shrink: 0;
            border: none;
            background: none;
            color: var(--text-tertiary);
            font-size: 16px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }
        .toast-close:hover { color: var(--text-primary); }
        .toast-success { border-left: 3px solid var(--success); }
        .toast-success .toast-icon { color: var(--success); }
        .toast-error { border-left: 3px solid var(--error); }
        .toast-error .toast-icon { color: var(--error); }
        .toast-warning { border-left: 3px solid var(--warning); }
        .toast-warning .toast-icon { color: var(--warning); }
        .toast-info { border-left: 3px solid var(--info); }
        .toast-info .toast-icon { color: var(--info); }

        /* ============================================
           TEMPLATES DROPDOWN
           ============================================ */
        .templates-dropdown {
            position: fixed;
            z-index: 100;
            min-width: 280px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--bg-elevated);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 4px;
        }
        .templates-dropdown-header {
            padding: 8px 12px 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
        }
        .templates-dropdown-item {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .templates-dropdown-item:hover {
            background: var(--accent-muted);
        }
        .templates-item-name { font-weight: 500; }
        .templates-item-desc {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        /* ============================================
           KEYBOARD SHORTCUTS MODAL
           ============================================ */
        .shortcuts-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .shortcuts-modal {
            background: var(--bg-elevated);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            width: 440px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .shortcuts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border-primary);
        }
        .shortcuts-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .shortcuts-close {
            border: none;
            background: none;
            color: var(--text-tertiary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .shortcuts-close:hover { background: var(--bg-hover); color: var(--text-primary); }
        .shortcuts-body { padding: 12px 20px 20px; }
        .shortcuts-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-secondary);
        }
        .shortcuts-row:last-child { border-bottom: none; }
        .shortcuts-keys { display: flex; align-items: center; gap: 4px; }
        .shortcuts-desc { color: var(--text-secondary); font-size: 12px; }
        kbd {
            display: inline-block;
            padding: 2px 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-primary);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            box-shadow: 0 1px 0 var(--border-primary);
        }
        .key-plus {
            color: var(--text-tertiary);
            font-size: 10px;
            margin: 0 1px;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .main-area { flex-direction: column; }
            .left-panel {
                width: 100% !important;
                max-width: none;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid var(--border-primary);
            }
            .split-handle { display: none; }
            .toolbar-title span { display: none; }
            .status-bar-hint { display: none; }
        }
    </style>
</head>
<body>
    <noscript>
        <div style="padding:16px;font-family:sans-serif">
            CircuitSim is a client-side simulator and requires JavaScript to run.
        </div>
    </noscript>
    <div id="app">
        <!-- TOOLBAR -->
        <div class="toolbar" id="toolbar">
            <div class="toolbar-brand">
                <svg class="toolbar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                <div class="toolbar-title">CircuitSim <span>v0.1</span></div>
            </div>

            <div class="toolbar-group">
                <button class="tb-btn" id="templates-btn" title="Load a template circuit">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 011.75 2h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 2.75zm0 5A.75.75 0 011.75 7h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 7.75zm0 5a.75.75 0 01.75-.75h12.5a.75.75 0 010 1.5H1.75a.75.75 0 01-.75-.75z"/></svg>
                    Templates
                </button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button class="tb-btn tb-btn-primary" id="compile-btn" title="Compile circuit (Ctrl+Enter)">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6V2z"/></svg>
                    Compile
                </button>
                <button class="tb-btn" id="clear-btn" title="Clear editor">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 1.75V3h2.25a.75.75 0 010 1.5H2.75a.75.75 0 010-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75zM4.496 6.675a.75.75 0 10-1.492.15l.66 6.6A1.75 1.75 0 005.405 15h5.19a1.75 1.75 0 001.741-1.575l.66-6.6a.75.75 0 10-1.492-.15l-.66 6.6a.25.25 0 01-.249.225h-5.19a.25.25 0 01-.249-.225l-.66-6.6zM6.5 1.75V3h3V1.75a.25.25 0 00-.25-.25h-2.5a.25.25 0 00-.25.25z"/></svg>
                    Clear
                </button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button class="tb-btn tb-btn-icon" id="undo-btn" title="Undo (Ctrl+Z)" disabled>
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 5.5h8a4 4 0 110 8H6a.75.75 0 010-1.5h3.5a2.5 2.5 0 000-5h-8v2L0 5.5 1.5 2v3.5z"/></svg>
                </button>
                <button class="tb-btn tb-btn-icon" id="redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.5 5.5h-8a4 4 0 100 8H10a.75.75 0 010 1.5H6.5a5.5 5.5 0 110-11h8V2L16 5.5 14.5 9V5.5z"/></svg>
                </button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button class="tb-btn" id="save-btn" title="Save circuit (Ctrl+S)">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 01-.927-.928l.929-3.25a1.75 1.75 0 01.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 00-.354 0L3.463 11.098a.25.25 0 00-.064.108l-.558 1.953 1.953-.558a.25.25 0 00.108-.064l8.61-8.61a.25.25 0 000-.354l-1.086-1.086z"/></svg>
                    Save
                </button>
                <button class="tb-btn" id="load-btn" title="Open circuit file (Ctrl+O)">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 1.5a.25.25 0 00-.25.25v11.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25V6H9.75A1.75 1.75 0 018 4.25V1.5H3.75zm5.75.56v2.19c0 .138.112.25.25.25h2.19L9.5 2.06zM2 1.75C2 .784 2.784 0 3.75 0h5.086c.464 0 .909.184 1.237.513l3.414 3.414c.329.328.513.773.513 1.237v8.086A1.75 1.75 0 0112.25 15h-8.5A1.75 1.75 0 012 13.25V1.75z"/></svg>
                    Open
                </button>
                <button class="tb-btn" id="export-btn" title="Export as PNG (Ctrl+Shift+E)">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 12l-4-4h2.5V2h3v6H12l-4 4z"/><path d="M14 14H2v-2h12v2z"/></svg>
                    PNG
                </button>
                <button class="tb-btn" id="svg-btn" title="Export as SVG (vector)">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v12H2V2zm1.5 1.5v9h9v-9h-9z"/><path d="M5 10l2-3 1.5 2 1-1.5L12 10H5z"/></svg>
                    SVG
                </button>
            </div>

            <div class="toolbar-spacer"></div>

            <div class="toolbar-group">
                <button class="tb-btn tb-btn-icon" id="theme-btn" title="Toggle theme"></button>
                <button class="tb-btn tb-btn-icon" id="shortcuts-btn" title="Keyboard shortcuts (Ctrl+/)">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 8a8 8 0 1116 0A8 8 0 010 8zm8-6.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM6.92 6.085h.001a.749.749 0 11-1.342-.67c.169-.339.516-.592.916-.678.4-.086.85-.005 1.21.213.36.22.644.581.783.996.14.416.103.88-.09 1.27a1.52 1.52 0 01-.3.38l-.3.24c-.098.076-.139.126-.164.168a.25.25 0 00-.023.065v.15a.75.75 0 01-1.5 0v-.15c0-.333.098-.622.262-.862.16-.234.372-.404.546-.52l.296-.237a.45.45 0 00.04-.04c.062-.088.086-.19.065-.3-.02-.11-.075-.21-.15-.27-.074-.059-.175-.096-.29-.07-.114.025-.198.09-.245.165zM9 11a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
                </button>
            </div>
        </div>

        <!-- MAIN AREA -->
        <div class="main-area" id="main-area">
            <!-- LEFT PANEL -->
            <div class="left-panel" id="left-panel">
                <!-- Component Library -->
                <div id="component-library"></div>

                <!-- Code Editor Section -->
                <div class="editor-section">
                    <div class="editor-section-header">
                        <span>Code Editor</span>
                        <div class="editor-actions">
                            <button class="compile-btn" id="compile-btn-2">
                                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6V2z"/></svg>
                                Compile
                            </button>
                        </div>
                    </div>
                    <div id="code-editor-container"></div>
                    <div class="error-panel hidden" id="error-panel"></div>
                </div>
            </div>

            <!-- CANVAS PANEL -->
            <div class="canvas-panel" id="canvas-panel">
                <canvas id="circuit-canvas"></canvas>
            </div>
        </div>

        <!-- STATUS BAR -->
        <div id="status-bar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
