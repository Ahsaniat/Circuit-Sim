<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitSim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .editor-panel {
            width: 350px;
            min-width: 280px;
            max-width: 500px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .editor-header {
            padding: 10px 14px;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
            font-size: 13px;
            background: #fafafa;
        }
        .editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #code-editor {
            flex: 1;
            width: 100%;
            padding: 10px 12px;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.6;
            background: #fff;
        }
        .toolbar {
            padding: 8px 10px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 6px;
            background: #fafafa;
        }
        .btn {
            padding: 6px 14px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .btn-primary {
            background: #0066cc;
            color: #fff;
            border-color: #0055aa;
        }
        .btn-primary:hover {
            background: #0055aa;
        }
        .canvas-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }
        .canvas-header {
            padding: 10px 14px;
            border-bottom: 1px solid #ddd;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #f5f5f5;
        }
        #circuit-canvas {
            display: block;
        }
        .error-panel {
            background: #fef2f2;
            border-top: 1px solid #fca5a5;
            padding: 10px 12px;
            font-size: 12px;
            font-family: 'SF Mono', 'Consolas', monospace;
            color: #b91c1c;
            max-height: 120px;
            overflow-y: auto;
        }
        .error-panel.hidden {
            display: none;
        }
        .status {
            font-size: 11px;
            color: #666;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .editor-panel {
                width: 100%;
                max-width: none;
                height: 40vh;
                min-height: 200px;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            .canvas-panel {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-panel">
            <div class="editor-header">Circuit Code</div>
            <div class="editor-content">
                <textarea id="code-editor" spellcheck="false">@comp A1 7408
@comp O1 7432
@board B1 breadboard_830

map (
    (A1 pin 3 -> O1 pin 1)
    (A1 pin 6 -> O1 pin 2)
    (O1 pin 3 -> A1 pin 4)
)</textarea>
            </div>
            <div class="toolbar">
                <button class="btn btn-primary" id="compile-btn">Compile</button>
                <button class="btn" id="clear-btn">Clear</button>
            </div>
            <div class="error-panel hidden" id="error-panel"></div>
        </div>
        <div class="canvas-panel">
            <div class="canvas-header">
                <span>Circuit View</span>
                <span class="status" id="status">Ready</span>
            </div>
            <div class="canvas-container">
                <canvas id="circuit-canvas"></canvas>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
